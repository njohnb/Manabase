name: Release the MCPB bundle

# The Chat tab's install artifact is built here and nowhere else. A friend downloads
# manabase.mcpb from a Release; nobody hand-packs one. See PLUGIN-PRD PC-03 and P-14.
#
# The tag names the *bundle*, not the plugin — plugin.json stays version-less under P-08
# until Slice 13 settles it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # dist/ is committed on purpose (P-09). Rebuilding here and failing on a diff is the
      # check that a released bundle can never carry a server the repo does not describe.
      - name: Rebuild and prove dist/ is not stale
        run: |
          npm run build
          # Porcelain, not `git diff --exit-code`: an *absent* dist/index.js is recreated by
          # the rebuild as an untracked file, which git diff does not report at all. Same
          # comparison ci.yml uses — see docs/slices/TrackC-Slice11.md, requirement 8.
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error title=dist/ is stale::dist/ is stale — run 'npm run build' and commit dist/index.js (P-09, PQ-06)."
            git --no-pager diff --stat -- dist/
            git status --porcelain -- dist/
            exit 1
          fi

      # pack:mcpb unpacks what it just wrote and fails if server/index.js is not the committed
      # dist/index.js (PC-03 criterion 7). It lives in the pack script rather than in a step
      # here so the assertion is identical locally and on the runner — no second implementation
      # to drift, and nothing to add here.
      - name: Pack the bundle
        env:
          MANABASE_BUNDLE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run pack:mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: manabase-mcpb
          path: build/manabase.mcpb

      - name: Attach to the Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/manabase.mcpb --generate-notes --title "$GITHUB_REF_NAME"
